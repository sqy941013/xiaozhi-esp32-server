name: Manager Web Next CI

on:
  pull_request:
    paths:
      - "main/manager-web-next/**"
      - "main/manager-api/src/main/java/xiaozhi/modules/sys/controller/SysParamsController.java"
      - "main/manager-api/src/main/java/xiaozhi/common/utils/SensitiveDataUtils.java"
      - "main/manager-api/src/main/java/xiaozhi/modules/model/service/impl/ModelConfigServiceImpl.java"
      - "main/manager-api/src/test/java/xiaozhi/common/utils/SM2FrontendCompatibilityTest.java"
      - "main/manager-api/src/test/java/xiaozhi/common/utils/SensitiveDataUtilsTest.java"
      - "main/manager-api/src/test/java/xiaozhi/modules/model/service/impl/ModelConfigServiceImplTest.java"
      - "main/manager-api/src/test/java/xiaozhi/modules/agent/service/impl/AgentSnapshotServiceImplTest.java"
      - "Dockerfile-web-next"
      - "Dockerfile-web"
      - "docs/docker/nginx.conf"
      - "docs/docker/start.sh"
      - "main/xiaozhi-server/docker-compose.source.yml"
      - "main/xiaozhi-server/source-deploy.sh"
      - "main/xiaozhi-server/source-deploy.test.sh"
      - "main/xiaozhi-server/source.env.example"
      - "docs/docker-build.md"
      - "docs/frontend-react-migration.md"
      - ".github/workflows/manager-web-next.yml"
  push:
    branches:
      - main
    paths:
      - "main/manager-web-next/**"
      - "main/manager-api/src/main/java/xiaozhi/modules/sys/controller/SysParamsController.java"
      - "main/manager-api/src/main/java/xiaozhi/common/utils/SensitiveDataUtils.java"
      - "main/manager-api/src/main/java/xiaozhi/modules/model/service/impl/ModelConfigServiceImpl.java"
      - "main/manager-api/src/test/java/xiaozhi/common/utils/SM2FrontendCompatibilityTest.java"
      - "main/manager-api/src/test/java/xiaozhi/common/utils/SensitiveDataUtilsTest.java"
      - "main/manager-api/src/test/java/xiaozhi/modules/model/service/impl/ModelConfigServiceImplTest.java"
      - "main/manager-api/src/test/java/xiaozhi/modules/agent/service/impl/AgentSnapshotServiceImplTest.java"
      - "Dockerfile-web-next"
      - "Dockerfile-web"
      - "docs/docker/nginx.conf"
      - "docs/docker/start.sh"
      - "main/xiaozhi-server/docker-compose.source.yml"
      - "main/xiaozhi-server/source-deploy.sh"
      - "main/xiaozhi-server/source-deploy.test.sh"
      - "main/xiaozhi-server/source.env.example"
      - "docs/docker-build.md"
      - "docs/frontend-react-migration.md"
      - ".github/workflows/manager-web-next.yml"

permissions:
  contents: read

jobs:
  api-contract:
    name: Verify frontend/backend compatibility contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/manager-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile manager API and run compatibility tests
        run: mvn -B -DskipTests=false -Dtest=SM2FrontendCompatibilityTest,SensitiveDataUtilsTest,ModelConfigServiceImplTest,AgentSnapshotServiceImplTest test

  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/manager-web-next
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: main/manager-web-next/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm check

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

  docker:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: preview
            dockerfile: Dockerfile-web-next
            cache_scope: manager-web-next
            tag: xiaozhi-manager-web-next:ci
          - name: production
            dockerfile: Dockerfile-web
            cache_scope: manager-web-production
            tag: xiaozhi-manager-web:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate deployment files
        if: matrix.name == 'preview'
        run: |
          bash -n docs/docker/start.sh main/xiaozhi-server/source-deploy.sh main/xiaozhi-server/source-deploy.test.sh
          bash main/xiaozhi-server/source-deploy.test.sh
          docker compose \
            --env-file main/xiaozhi-server/source.env.example \
            -f main/xiaozhi-server/docker-compose.source.yml \
            config --quiet

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
